<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjGnMUcXhNWLMClDuw-Odfxw-o6wTnDSuANBWseDzD2l2GGqMsc1d-Td3w73mpn90GkcaBXkcceGtAtVsSJ725u4k6o1u6FCEWPQgmB4JMH9MCtRkMB6N-skQzmEfKr0IhmHADXufV4X26gIoDcV0gDGIjWwWo0n4bCGEAjAj3mveV_Ai61HDmRY83WbjJ5/s1600/1612767739ea449d6954bc3b3a5caf87ea8d8371e5.png" rel='icon' type='image/x-icon'/>
    <title>Coin Master | Coins & Spins</title>

    <meta
        name="description"
        content="Coin Master coins and spins interface demo"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">

        <section class="card">

            <!-- TOP BRAND -->
            <div class="brand">

                <div class="brand-glow"></div>

                <div class="image">

                    <div class="logo-coin">
                        
                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjGnMUcXhNWLMClDuw-Odfxw-o6wTnDSuANBWseDzD2l2GGqMsc1d-Td3w73mpn90GkcaBXkcceGtAtVsSJ725u4k6o1u6FCEWPQgmB4JMH9MCtRkMB6N-skQzmEfKr0IhmHADXufV4X26gIoDcV0gDGIjWwWo0n4bCGEAjAj3mveV_Ai61HDmRY83WbjJ5/s1600/1612767739ea449d6954bc3b3a5caf87ea8d8371e5.png" width="60" height="50"</img>
                    </div>

                </div>

            </div>


            <!-- CONTENT -->
            <div class="content">

                <div class="heading">

                    <h1>
                        Coin Master
                    </h1>

                    <p>
                        Coins &amp; Spins Booster
                    </p>

                </div>


                <!-- FORM -->
                <form id="boosterForm" novalidate>

                    <div class="field">

                        <label for="username">
                            Your Username
                        </label>

                        <div class="input-box">

                            <span class="input-icon">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <circle
                                        cx="12"
                                        cy="8"
                                        r="3"
                                    />
                                    <path
                                        d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"
                                    />
                                </svg>
                            </span>

                            <input
                                id="username"
                                name="username"
                                type="text"
                                placeholder="Username"
                                maxlength="30"
                                autocomplete="off"
                            >

                            <span
                                class="valid-icon"
                                id="validIcon"
                            >
                                ✓
                            </span>

                        </div>

                        <small
                            class="error"
                            id="usernameError"
                        ></small>

                    </div>


                    <!-- PLATFORM -->
                    <div class="field">

                        <label>
                            Select Platform
                        </label>

                        <div class="platform-grid">

                            <button
                                type="button"
                                class="platform"
                                data-platform="Android"
                            >

                                <div class="platform-icon android">

                                    <svg viewBox="0 0 24 24">
                                        <path
                                            d="M7 8h10v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8Z"
                                        />
                                        <path
                                            d="M8 8 6.5 5.5M16 8l1.5-2.5"
                                        />
                                        <circle
                                            cx="9"
                                            cy="11"
                                            r=".7"
                                        />
                                        <circle
                                            cx="15"
                                            cy="11"
                                            r=".7"
                                        />
                                    </svg>

                                </div>

                                <div class="platform-info">
                                    <strong>Android</strong></div>
                                <span class="radio"></span>

                            </button>


                            <button
                                type="button"
                                class="platform"
                                data-platform="iOS"
                            >

                                <div class="platform-icon ios">

                                    <svg viewBox="0 0 24 24">
                                        <path
                                            d="M15.7 12.6c0-2.1 1.7-3.1 1.8-3.2-1-.1-2.1-.9-3.2-.9-1.3 0-2.4.8-3 .8-1 0-1.9-.8-3-.8-1.5 0-2.8.9-3.5 2.2-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.5 2.1 2.6 2.1 1 0 1.4-.7 2.7-.7s1.7.7 2.7.7c1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2-.8-2-2.4Z"
                                        />
                                        <path
                                            d="M14.4 6.9c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.5 1 .1 1.9-.5 2.5-1.1Z"
                                        />
                                    </svg>

                                </div>

                                <div class="platform-info">
                                    <strong>iPhone</strong>
                                </div>

                                <span class="radio"></span>

                            </button>

                        </div>

                        <small
                            class="error"
                            id="platformError"
                        ></small>

                    </div>


                    <!-- CONTINUE -->
                    <a href="https://smrturl.co/a/sc8cd176410/364?s1=win"class="continue-btn">
                      <span>CONTINUE</span> 
                    </a>

                </form>


                <!-- FOOTER -->
                <div class="security">

                    <span class="lock">
                        © 

                    </span>

                    <span>
                        Copyright 2026
                    </span>

                </div>

            </div>

        </section>

    </main>


    <!-- SUCCESS MODAL -->
    <div
        class="modal"
        id="modal"
        aria-hidden="true"
    >

        <div class="modal-overlay"></div>

        <div class="modal-box">

            <button
                class="modal-close"
                id="modalClose"
                type="button"
            >
                ×
            </button>

            <div class="success-circle">
                ✓
            </div>

            <h2>
                Ready to Continue
            </h2>

            <p id="modalText">
                Your selection has been saved locally.
            </p>

            <button
                class="modal-button"
                id="modalOk"
                type="button"
            >
                OK
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
