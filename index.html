<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coin Master - Coins & Spins Booster</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Nunito", sans-serif;
            background: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Background blue shapes */
        body::before {
            content: "";
            position: fixed;
            left: -40px;
            top: 145px;
            width: 180px;
            height: 105px;
            background: #2e8bc7;
            border-radius: 0 70px 0 0;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            left: -50px;
            bottom: 75px;
            width: 190px;
            height: 108px;
            background: #2e8bc7;
            border-radius: 0 70px 0 0;
            z-index: -2;
        }

        /* Right blue decoration */
        .blue-shape {
            position: fixed;
            right: -80px;
            bottom: 65px;
            width: 210px;
            height: 95px;
            background: #2e8bc7;
            border-radius: 70px 0 0 0;
            transform: rotate(-5deg);
            z-index: -2;
        }

        /* Main container */
        .container {
            width: 540px;
            max-width: calc(100% - 30px);
            min-height: 520px;
            margin: 76px auto 40px;
            background: linear-gradient(
                145deg,
                #f8d39a,
                #f7cb88
            );
            border-radius: 15px;
            position: relative;
            padding: 95px 52px 55px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.02);
        }

        /* Logo box */
        .logo-box {
            position: absolute;
            width: 350px;
            max-width: 80%;
            height: 82px;
            left: 50%;
            top: -38px;
            transform: translateX(-50%);
            background: #ba7842;
            border: 3px solid #d99c13;
            border-radius: 12px;
            box-shadow:
                0 7px 10px rgba(0,0,0,0.30),
                inset 0 1px 1px rgba(255,255,255,0.3);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fake Coin Master logo */
        .coin-logo {
            text-align: center;
            line-height: 0.85;
            transform: rotate(-3deg);
        }

        .coin-logo .coin {
            font-size: 42px;
            display: block;
            filter: drop-shadow(0 2px 1px rgba(0,0,0,.5));
        }

        .coin-logo .text {
            font-size: 17px;
            font-weight: 900;
            color: #fff;
            text-shadow:
                2px 2px 0 #9c231e,
                -1px -1px 0 #9c231e;
        }

        /* Heading */
        .title {
            text-align: center;
            color: #672d1b;
            font-size: 40px;
            line-height: 1;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #5f351e;
            font-size: 17px;
            letter-spacing: 2px;
            margin-bottom: 23px;
        }

        /* Labels */
        label {
            display: block;
            color: #71381e;
            font-size: 16px;
            margin-bottom: 5px;
            letter-spacing: .5px;
        }

        /* Input */
        .input-wrapper {
            position: relative;
            margin-bottom: 27px;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #4d4e25;
            font-size: 23px;
        }

        #username {
            width: 100%;
            height: 70px;
            border: none;
            outline: none;
            background: rgba(255,255,255,.42);
            border-radius: 6px;
            padding: 0 20px 0 59px;
            font-size: 17px;
            font-weight: 700;
            color: #555;
            font-family: inherit;
        }

        #username::placeholder {
            color: #6c6c68;
            opacity: 1;
        }

        #username:focus {
            box-shadow: 0 0 0 2px rgba(103,45,27,.18);
            background: rgba(255,255,255,.58);
        }

        /* Platforms */
        .platforms {
            display: flex;
            gap: 10px;
        }

        .platform {
            width: 50%;
            height: 70px;
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 0 25px 0 25px;
            background: rgba(255,255,255,.38);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #71381e;
            transition: .2s ease;
        }

        .platform:first-child {
            border-radius: 0 25px 0 25px;
        }

        .platform i {
            font-size: 22px;
        }

        .platform:hover {
            background: rgba(255,255,255,.58);
            transform: translateY(-2px);
        }

        .platform.selected {
            background: rgba(255,255,255,.68);
            box-shadow:
                inset 0 0 0 2px #8d542d,
                0 3px 6px rgba(0,0,0,.12);
        }

        /* Continue button */
        .button-wrapper {
            position: absolute;
            left: 50%;
            bottom: -29px;
            transform: translateX(-50%);
        }

        #continueBtn {
            width: 210px;
            height: 74px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(
                to bottom,
                #05d052,
                #00b948
            );
            color: white;
            font-family: inherit;
            font-size: 21px;
            font-weight: 800;
            cursor: pointer;

            box-shadow:
                0 5px 9px rgba(0,0,0,.30),
                inset 0 2px 3px rgba(255,255,255,.35);

            transition: .2s ease;
        }

        #continueBtn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 13px rgba(0,0,0,.28),
                inset 0 2px 3px rgba(255,255,255,.35);
        }

        #continueBtn:active {
            transform: translateY(2px);
            box-shadow:
                0 3px 5px rgba(0,0,0,.25);
        }

        /* Loading */
        #continueBtn.loading {
            pointer-events: none;
            opacity: .85;
        }

        /* Message */
        .message {
            position: absolute;
            left: 50%;
            bottom: -75px;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #71381e;
            opacity: 0;
            transition: .3s;
        }

        .message.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 600px) {

            .container {
                margin-top: 70px;
                padding: 90px 25px 55px;
            }

            .title {
                font-size: 32px;
            }

            .subtitle {
                font-size: 14px;
            }

            .logo-box {
                height: 75px;
            }

            .platform {
                height: 65px;
            }

            #continueBtn {
                width: 190px;
                height: 68px;
            }
        }

        @media (max-width: 380px) {

            .container {
                padding-left: 18px;
                padding-right: 18px;
            }

            .title {
                font-size: 29px;
            }

            .platforms {
                gap: 7px;
            }
        }
    </style>
</head>

<body>

    <div class="blue-shape"></div>

    <main class="container">

        <!-- Logo -->
        <div class="logo-box">
            <div class="coin-logo">
                <span class="coin">🪙</span>
                <span class="text">COIN<br>MASTER</span>
            </div>
        </div>

        <!-- Title -->
        <h1 class="title">Coin Master</h1>

        <div class="subtitle">
            coins &amp; spins booster
        </div>

        <!-- Username -->
        <label for="username">your username</label>

        <div class="input-wrapper">
            <i class="fa-regular fa-circle-user"></i>

            <input
                type="text"
                id="username"
                placeholder="Username/ID"
                autocomplete="off"
            >
        </div>

        <!-- Platform -->
        <label>your platform</label>

        <div class="platforms">

            <div class="platform" data-platform="Android">
                <i class="fa-brands fa-android"></i>
            </div>

            <div class="platform" data-platform="iOS">
                <i class="fa-brands fa-apple"></i>
            </div>

        </div>

        <!-- Button -->
        <div class="button-wrapper">

            <button id="continueBtn">
                <span id="buttonText">Continue</span>
            </button>

            <div class="message" id="message"></div>

        </div>

    </main>


    <script>

        // =====================================
        // VARIABLES
        // =====================================

        const usernameInput = document.getElementById("username");
        const platforms = document.querySelectorAll(".platform");
        const continueBtn = document.getElementById("continueBtn");
        const buttonText = document.getElementById("buttonText");
        const message = document.getElementById("message");

        let selectedPlatform = "";


        // =====================================
        // PLATFORM SELECTION
        // =====================================

        platforms.forEach(platform => {

            platform.addEventListener("click", function() {

                // Remove selected class
                platforms.forEach(item => {
                    item.classList.remove("selected");
                });

                // Add selected class
                this.classList.add("selected");

                // Save selected platform
                selectedPlatform = this.dataset.platform;

            });

        });


        // =====================================
        // CONTINUE BUTTON
        // =====================================

        continueBtn.addEventListener("click", function() {

            const username = usernameInput.value.trim();

            // Reset message
            message.classList.remove("show");

            // Validate username
            if (username === "") {

                showMessage("Please enter your Username/ID.");
                usernameInput.focus();

                return;
            }


            // Validate platform
            if (selectedPlatform === "") {

                showMessage("Please select your platform.");

                return;
            }


            // Loading effect
            continueBtn.classList.add("loading");
            buttonText.innerHTML = "Loading...";


            // Simulate processing
            setTimeout(() => {

                continueBtn.classList.remove("loading");
                buttonText.innerHTML = "Continue";

                showMessage(
                    "Username: " +
                    username +
                    " | Platform: " +
                    selectedPlatform
                );

            }, 1500);

        });


        // =====================================
        // MESSAGE FUNCTION
        // =====================================

        function showMessage(text) {

            message.innerHTML = text;
            message.classList.add("show");

        }


        // =====================================
        // ENTER KEY
        // =====================================

        usernameInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                continueBtn.click();
            }

        });

    </script>

</body>
</html>
